name: Publish to Stores

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: 'Target store'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - chrome

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Chrome extension
        if: inputs.target == 'all' || inputs.target == 'chrome'
        run: pnpm build

      - name: Build Firefox extension
        if: inputs.target == 'all' || inputs.target == 'firefox'
        run: pnpm build:firefox

      - name: Package Chrome zip
        if: inputs.target == 'all' || inputs.target == 'chrome'
        run: pnpm zip

      - name: Package Firefox zip
        if: inputs.target == 'all' || inputs.target == 'firefox'
        run: pnpm zip:firefox

      - name: Upload to Chrome Web Store
        if: inputs.target == 'all' || inputs.target == 'chrome'
        run: node scripts/publish-chrome.mjs
        env:
          CHROME_ZIP_PATH: .output/corsair-0.1.2-chrome.zip
